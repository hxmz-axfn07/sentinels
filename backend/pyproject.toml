[project]
name = "sentinel-backend"
version = "0.1.0"
description = "SENTINEL network intrusion detection API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.24,<3",
    "pydantic-settings>=2.7,<3",
    "pymysql>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "scapy>=2.6.1,<3",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "python-docx>=1.1,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "python-pptx>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
